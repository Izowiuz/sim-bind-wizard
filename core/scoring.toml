# How a control is chosen. The numbers the allocator works from, in one
# place, with what each of them is FOR beside it.
#
# They are judgements. "+25 because it suits the job" against "+20 because
# it is exactly the shape asked for" is somebody's opinion about which
# matters more, and this project moves judgements out of source -- the 382
# in games/*/‑binds.json went first, and these are the same kind.
#
# A game may override any table here with a scoring.toml of its own, merged
# key by key. Two already need to: DCS replaces the band limits, because its
# needs come from a vocabulary cut at a vote threshold rather than from a
# hand-written list, and has room to spare.
#
# What a game may NOT define is what a condition MEANS. `device_matches` is
# a predicate over a control and a need, named here and written in
# core/needs.py. A file that could define conditions would need an
# expression language, and that is a worse thing to own than this file.

[reach]
# The map measures this now, finger by finger, and hands over a number:
# how far the nearest way of reaching a control is from flying. These are
# the map's own levels, so there is nothing here to keep in step by hand.
means = [
  [0, "your hand where it lives"],
  [1, "one finger, the hand still on the grip"],
  [2, "the hand off the grip, still on the device"],
  [3, "the hand off the device"],
  [4, "nobody measured it"],
]
# What a control nobody has measured counts as where a tier is needed at
# all. The reach term does not fire for one -- rewarding it for distance
# nobody measured is how an unmeasured button beat a measured thumb -- so
# this is only what the gates read, and they let it through: how far it is
# is the question, and there is no answer to refuse it with.
unmeasured = 4

# When you reach for a thing, and what that lets it take. `takes` is
# [closest allowed, furthest allowed] in the tiers above.
[[band]]
name  = "in a turn"
takes = [0, 1]
note  = """Tier 2 was tried here and measured worse: War Thunder's airbrake, \
bombs, radar ACM, sight stabilisation and air-to-ground lock were being \
served by the borrow pass, which runs last, so tightening this let 'in the \
air' take the whole controls whose presses they were borrowing. Five combat \
functions moved to the keyboard panel and five cruise functions took their \
place. The fault is the pass order, not the ceiling."""

[[band]]
name  = "on approach"
takes = [0, 3]

[[band]]
name  = "in the air"
takes = [0, 3]

[[band]]
name  = "on the ramp"
takes = [2, 3]
note  = """Starts at 2 on purpose. Without it, something you do once with \
the canopy open grabs a thumb position the moment one is free, and the only \
defence left is hand-sorting the need list -- which is what War Thunder was \
reduced to."""

# The passes, in the order they run.
[[pass]]
name = "yours"
does = "you put it here, and nothing asks or argues"

[[pass]]
name = "pinned"
does = "a control you named, taken before anything else"

[[pass]]
name = "floored"
does = "the ordinary try, with both limits above holding"

[[pass]]
name = "relaxed"
does = "nothing was left inside them, so the far end opens"

[[pass]]
name = "borrowed"
does = "a spare button on a control something else owns"

# What makes one control beat another. `when` names a predicate defined in
# core/needs.py; `per` names a count to multiply the weight by; `takes`
# ("button" or "axis") narrows a term to one kind of input, and silence
# means both -- three of these are about buttons and nothing else, and
# left unsaid they leaked into an axis: `reach` paid a lever for being
# far from a hand it does not compete for, and `spare` paid for a
# control with MINUS one spare button, because a lever has none.
#
# `pass` narrows a row to one of the passes above, and silence again means
# both. The last pass lends a need one spare button of a control something
# else owns, and it is scored differently on purpose: nothing better is
# coming after it, so the reward for distance turns around, and the
# control's shape is not the question because the control is not what the
# need is getting. That used to be four numbers written into `allocate` --
# and then written again, by hand, so the screen had words to show. Both
# copies are these rows now.
[[term]]
name   = "pinned"
pass   = "placed"
weight = 1000
when   = "pinned"
says   = "pinned to {label}"
general = "pinned to a control you named"
stops  = true
note   = """A pin outranks the reach tables, not just the ordering. It was a \
+500 bonus applied AFTER the ceiling, so a pinned control the ceiling \
excluded scored nothing and the bonus never ran: BMS's pinky shift scored \
721 with a loose ceiling and nothing with a tight one, and moved silently to \
the thumb mini-stick -- a control you cannot hold as a modifier while working \
the thumb hats the shifted layer sits on."""

[[term]]
name   = "stayed"
pass   = "placed"
weight = 20
when   = "stayed"
says   = "where you left it"
note   = """A layout is learnt with the hands, so where a binding already is \
is worth points. Without this the allocator answered every regeneration from \
scratch: moving ONE binding by hand moved 21 of X4's 32, because every other \
decision was taken afresh against a board that had shifted under it.

Twenty is measured, not judged. Thirty forced moves across the five games, \
one hand-placed binding each:

    weight    bindings moved    layout worth
         0              16.8          116897
        10               3.4          116897
        20               3.4          116897
        30               3.1          116799
        50               2.9          116753
       100               3.0          116683

Eighty per cent of the churn goes for nothing at all -- the layouts at 20 \
are worth exactly what they were worth at 0. Past 20 you start buying \
tenths of a binding with real quality. And about three is the floor: that is \
the true cascade, the one you moved plus what it displaces."""

[[term]]
name   = "fits"
pass   = "placed"
weight = 100
when   = "always"
says   = "the shape and the count fit"

[[term]]
name   = "reach"
pass   = "placed"
takes  = "button"
weight = 12
when   = "measured"
per    = "tier"
says   = "leaves the closer controls free"
general = "for each tier further from your hand"
note   = """Rewards the LEAST precious control that still does the job. Needs \
are placed most-urgent-first, so the thumb positions are already spoken for \
by the time anything from the ramp gets a look."""

[[term]]
name   = "device_right"
weight = 40
when   = "device_matches"
says   = "on the {role}, as asked"
general = "on the device it asked for"

[[term]]
name   = "device_wrong"
pass   = "placed"
weight = -50
when   = "device_differs"
says   = "the wrong device, not the {device}"
general = "on a different device"

[[term]]
name   = "place_right"
pass   = "placed"
weight = 15
when   = "always"
per    = "place kept"
says   = "where the overlay wants it"
general = "for each of the overlay's place words it answers"
plural = "{n} of the overlay's place words"
note   = """What makes an overlay a cockpit template rather than a device \
preference. `finger = "thumb"`, `level = "HOME"` is the Hornet's castle \
switch said in words that survive leaving the Hornet's grip, and this is \
what makes the allocator lean that way. Deliberately smaller than \
`device_right`: a template is a lean, not a law, and a layout that refused \
every control the template did not name would place half an aircraft on a \
desk that is not the one it was drawn for."""

[[term]]
name   = "place_wrong"
pass   = "placed"
weight = -20
when   = "always"
per    = "place broken"
says   = "not where the overlay wants it"
general = "for each of the overlay's place words it contradicts"
plural = "against {n} of the overlay's place words"

[[term]]
name   = "exact_shape"
pass   = "placed"
weight = 20
when   = "exact_shape"
says   = "the exact shape, {kind}"
general = "exactly the shape it asked for"

[[term]]
name   = "click"
pass   = "placed"
takes  = "button"
weight = 15
when   = "has_click"
says   = "has a click"

[[term]]
name   = "directions_differ"
pass   = "placed"
takes  = "button"
weight = -8
when   = "directions_differ"
says   = "the directions differ"
note   = """A control whose directions merely differ is still a home -- a \
rocker is up/down and a need asking for left/right is happy enough on it."""

[[term]]
name   = "no_directions"
pass   = "placed"
takes  = "button"
weight = -60
when   = "no_directions"
says   = "no directions"
note   = """A different matter, and the test has to be against the direction \
vocabulary rather than "has any label": a selector answers '1'..'5' and an \
encoder 'ccw'/'cw', which are positions. Reading those as directions let \
Elite's four panel-focus actions onto a five-position switch that HOLDS \
whichever position it is in.

Buttons only, like its milder half. `on` means two different things: which
DIRECTIONS a switch moves in, and which AXIS of a control a lever need wants
-- `on = ["y"]` is the stick's pitch axis. Both of these read it the first
way, so every axis need that named its axis was charged -60 for a control
whose buttons do not point that way. The ask itself is checked against the
axis's own role, where it belongs."""

[[term]]
name   = "spare"
pass   = "placed"
takes  = "button"
weight = -4
when   = "always"
per    = "spare"
says   = "{n} spare button"
general = "for each spare button it does not need"
plural = "{n} spare buttons"

[[term]]
name   = "lent"
pass   = "borrowed"
weight = 60
when   = "always"
says   = "still free in the last try"
note   = """What a borrowed button is worth before anything is said about \
which one. Below `fits` on purpose: these are not compared against the \
ordinary passes -- by the time this one runs they have finished -- so what \
the number has to do is sit above what the facts can take off it."""

[[term]]
name   = "left_over"
pass   = "borrowed"
weight = 12
when   = "always"
per    = "closeness"
says   = "the best of what was left"
note   = """`reach` upside down, and that is the whole difference between \
this pass and the others. They reward the furthest control that still does \
the job, because something more urgent may still be coming; nothing is \
coming after this one, so a leftover need should get the best of what is \
left. Rewarding distance here sent War Thunder's airbrake, bombs and sight \
stabilisation off the thumb onto the middle-finger hat for nobody's gain."""

[[term]]
name   = "opens"
pass   = "borrowed"
weight = -15
when   = "untouched"
says   = "opens a control that nothing has touched"
note   = """Prefer a spare position on a control already in use. Four idle \
two-way rockers should not sit there while a cold-start switch goes \
homeless, so this is small -- but neither should one be broken open while a \
real spare exists."""

# Why a control is refused outright, before any of the above runs.
[[gate]]
when = "unusable"
says = "the game cannot address it"

[[gate]]
when = "wrong_shape"
pass = "placed"
says = "it is the wrong shape"
note = """Not when borrowing. What a borrowed button is taken off is a \
control something else owns -- a hat's fourth direction, a rocker's spare \
half -- and refusing those for their shape would leave the pass with the \
one thing it cannot offer: a whole control."""

[[gate]]
when = "too_few"
says = "it has too few bindable buttons"

[[gate]]
when = "stepped"
says = "it reports its two extremes and nothing in between"

[[gate]]
when = "out_of_reach"
says = "its reach is outside the limits above"

# What the device map MEASURED about a control, and what turns it on in a
# need. The map answers five questions per control -- can you hold it, can
# you tap it, can you find it blind, can you hit it by mistake, can you hold
# it as a modifier -- and for a year nothing here read any of them.
#
# The rows above are each a named predicate written in core/needs.py. These
# are not: they all have one of three shapes, so one predicate is built from
# the row instead. Adding a sixth fact is a block here and nothing else --
# the flag appears on every Need, the words appear in every reason, and
# `check_rules` fails loudly if `reads` is not a field the map has.
#
# This is not the expression language the header refuses. The file still
# cannot say what `device_matches` MEANS; it fills in a shape that is fixed
# here. A fact about a PAIR of controls -- "can you work these two at once"
# -- does not fit and will cost code, which is the honest limit.
#
#   on       `axis` to read what the map measured about the LEVER rather
#            than about the control carrying it: three of the stick's
#            axes are one control and only one of them is pitch
#   reads    the control's field in devicemap.Group, or the axis's in
#            devicemap.Axis where `on = "axis"` -- a property counts,
#            because half of what the map answers about an axis is
#            derived from `rest` and `moves_with`
#   asked    the flag this puts on every Need; the fact only counts for a
#            need that sets it
#   yes/no   weights for a bool the map answered either way
#   same/other  weights for a closed field the need names a value of:
#            `rest` is where an axis sits when you let go, and a need
#            says which it has to be
#   scale    weight per step of a 0/1/2 answer
#   below    charge the SHORTFALL from this answer instead of the answer
#   refuses  a gate rather than a term: the control is not offered at all
#
# A fact NOBODY answered counts for nothing, either way. That is the same
# rule as `measured` on the reach term, and it lives in the predicate rather
# than in each row, so no future fact can forget it.

[[fact]]
reads = "hold_ok"
asked = "held"
yes   = 25
no    = -45
says  = "you can hold it"
not   = "awkward to hold down"
note  = """Asymmetric on purpose, like device_right/device_wrong. Your 41 \
controls split 19/22 on this, so both answers carry information -- and "you \
cannot hold this one" is a fault, not merely the absence of a virtue."""

[[fact]]
reads = "rapid_ok"
asked = "rapid"
yes   = 25
no    = -45
says  = "you can tap it quickly"
not   = "awkward to tap again and again"

[[fact]]
reads  = "blind_distinct"
asked  = "by_feel"
scale  = -20
below  = 2
says   = "hard to find by feel"
plural = "you cannot find it by feel"
general = "for each step short of finding it by feel"
note   = """This rode the need's band at first, on the argument that finding \
a thing without looking matters exactly when you are busy. It moved 81 \
bindings of 201 -- 19 onto a better control and 19 onto a worse one. A fact \
that counts for every need in the two fastest bands touches half the list at \
once, and half a list moving for no gain is weather, not a rule. So it asks, \
like the others, and what it asks is not the band: X4's map is not urgent AND \
does not want finding blind, while a canopy you set on the ramp is one you \
are looking straight at.

Charged as a shortfall rather than paid as a bonus, because 20 of the 22 \
controls a hand reaches without moving answer this at the top: a bonus paid \
nearly every candidate the same and decided nothing. The information is in \
the minority answer, which is why `no_directions` is a penalty and there is \
no term for merely having directions."""

[[fact]]
reads  = "accident_risk"
asked  = "costly"
scale  = -30
says   = "easy to hit by mistake"
plural = "very easy to hit by mistake"
general = "for each step of how easily it is hit by mistake"
note   = """Gated by the need rather than charged to every control, because \
a control you can knock is only a problem under something that hurts when \
knocked. Charged flatly it would push everything away from the same \
controls, and something still has to go there."""

[[fact]]
reads   = "modifier_ok"
asked   = "modifier"
refuses = true
says    = "you cannot hold it as a modifier"
note    = """A gate, not a bonus: five of 41 controls qualify, so this is a \
constraint on where a shift can live and not a preference between homes. It \
refuses only on a measured "no" -- on a map nobody has answered, a gate that \
refused out of ignorance would leave the shift nowhere at all, which is the \
same argument `out_of_reach` makes."""

# ---- and about a LEVER, for a need that takes an axis ------------------
#
# The same table, reading the axis instead of the control. There is no
# reach term among these: the reach limits are about competing for the
# homes near your hand, and nothing competes for levers -- there is one
# pitch axis and it is where it is.

[[fact]]
on     = "axis"
reads  = "rest"
asked  = "rests"
same   = 40
other  = -40
says   = "rests where this row needs it"
not    = "rests somewhere else"
note   = """Where an axis sits when you let go, in the map's own words \
(`centred` `min` `mid` `max`), against the word the need names. Pitch has \
to spring back or the aircraft will not fly level; a throttle has to stay \
or it returns to half power when you let go; a brake or a zoom has to rest \
at the minimum or it is part-on from the moment the game starts. One \
question, so one row -- it was going to be two flags that excluded each \
other, which is a scale written as two booleans. Three games each wrote \
their own search over this ("a slider or lever you can read absolutely", \
"steadiest first: something that stays where you leave it")."""

[[term]]
name   = "coupled"
takes  = "axis"
weight = -25
when   = "coupled"
says   = "moves with another lever"
general = "when this binding drives a second lever too"
note   = """The map answers this per axis, AS THE HARDWARE IS SET UP NOW: \
the VMAX's two throttle levers travel together until you release the \
catch, so binding one binds both engines. Not a gate -- where the pair IS \
what you want, one thrust for two engines, there may be nothing else to \
take. Beatable by the resting match above, which is the ordering those \
two have to keep: a lever that rests right and moves with its twin is \
still a better throttle than one that springs back."""

[shapes]
# What may stand in for what. The first entry is the shape actually asked
# for and scores the `exact_shape` bonus; the rest are substitutes.
# An axis is a kind the map has, for a control that is only an axis and
# nothing finer. `axis` as an ASK means "any lever will do" -- which is
# what a command whose prose says `spare axis` is asking for -- and the
# substitutions are every kind that carries one.
axis      = ["axis", "lever", "slider", "dial", "pedal", "wheel"]
lever     = ["lever", "slider"]
hat2      = ["hat2", "switch2", "switch3", "hat4", "selector"]
hat4      = ["hat4", "hat8", "selector"]
button    = ["button", "paddle", "dial"]
paddle    = ["paddle", "button"]
trigger   = ["trigger"]
ministick = ["ministick"]
encoder   = ["encoder", "dial"]
dial      = ["dial", "encoder"]
latch     = ["latch"]
selector  = ["selector"]

[jobs]
# What a function is FOR. The one word a game and an overlay can both say:
# a game's needs file names the job, an overlay's `[[want]]` matches on it,
# and neither has to know anything about the other. `f-18.toml` says "sensor
# work goes under the thumb" and it means the same thing in DCS and in X4.
#
# A closed list, checked when a needs file loads. It used to be free text
# called `suits`, with eleven words on two different axes -- `fire`, `lock`
# and `view` said what the job IS, while `toggle`, `reflex` and
# `stepped-pair` said how the control BEHAVES. The second kind is gone:
# `shape`, `held` and `rapid` already say it, and they say it precisely.
# Sixty-five of the hundred and forty-seven needs said nothing at all, so an
# overlay had nothing to take hold of for nearly half the list.
fire    = "trigger, cannon, missiles, what is armed"
lock    = "picking a target and holding it"
sensor  = "radar, scan, sensor modes and cursors"
view    = "looking around: cameras, head, sights"
trim    = "trim and fine correction"
flight  = "how the aircraft flies: modes, brakes, flaps, thrust"
systems = "gear, lights, power, the aircraft's own machinery"
defence = "flares, chaff, jammer, armour"
comms   = "radio, missions, menus, panels"
nav     = "maps, jumps, docking, course"

[mechanisms]
# Controls whose buttons are one physical mechanism rather than independent
# positions. They lend their click and nothing else.
one = ["latch", "trigger", "selector", "encoder"]

[directions]
# Hats are captured with whichever words fitted the control at the time, so
# a need asking for "forward" has to accept "up" from a hat that calls it so.
forward = ["up", "fwd"]
up      = ["up", "fwd"]
back    = ["down", "aft"]
down    = ["down", "aft"]
left    = ["left"]
right   = ["right"]
push    = ["push"]
