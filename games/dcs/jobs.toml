# What each of DCS's own controls is FOR, so an overlay can take hold of it.
#
# The other five games keep a hand-written needs file and name the job there.
# DCS does not: it derives its needs from the module's command vocabulary on
# every run, cut at a vote threshold, so there is nowhere to write a judgement
# and nothing would survive the next harvest. This is read instead, and the
# job is worked out afresh each time.
#
# Keyed on words in the command's own name, because DCS names the real
# cockpit control: `Gun Trigger - SECOND DETENT`, `Sensor Control Switch`,
# `Throttle Designator Controller`. The jet says what the thing is; this only
# translates its vocabulary into the ten words `core/scoring.toml` defines.
# So it is nobody's opinion about the Hornet, which matters -- it is the one
# game where `overlays/f-18.toml` is about the aircraft actually in the
# cockpit.
#
# Order is load-bearing: the first entry whose `when` appears in the name
# wins, matched case-insensitively anywhere in it. Specific phrases go above
# general words -- `fov select` has to be read before `select`, or the FLIR
# field-of-view button becomes a weapon control.
#
# A command no entry matches keeps no job at all and `propose.py` says how
# many. That is not a failure: a module nobody has gone through yet simply
# lays out on reach and shape, exactly as it did before this file existed.

[[job]]
is = "sensor"
when = [
    "sensor control",
    "throttle designator",
    "radar elevation",
    "cage/uncage",
    "fov select",
    "raid/flir",
    "recce",
    "tdc",
]

[[job]]
is = "fire"
when = [
    "trigger",
    "weapon release",
    "master arm",
    "master mode",
    "pickle",
    "gun",
    "select",          # the stick's SRM/MRM/GUN select switch
]

[[job]]
is = "lock"
when = ["undesignate", "target management", "tms", "lock"]

[[job]]
is = "defence"
when = ["dispense", "countermeasure", "chaff", "flare", "ecm", "jammer"]

[[job]]
is = "trim"
when = ["trim"]

[[job]]
is = "comms"
when = ["comm switch", "radio", "mids", "intercom", "ics"]

[[job]]
is = "view"
when = ["zoom", "view", "head track", "nvg", "night vision", "visor"]

[[job]]
is = "nav"
when = ["waypoint", "steerpoint", "tacan", "ils", "autopilot route"]

[[job]]
is = "flight"
when = [
    "autopilot",
    "nosewheel",
    "nose wheel",
    "speed brake",
    "speedbrake",
    "flap",
    "wheel brake",
    "atc engage",       # the Hornet's autothrottle
    "pitch",
    "roll",
    "rudder",
    "thrust",
    "throttle",
]

[[job]]
is = "systems"
when = [
    "landing gear",
    "launch bar",
    "arresting hook",
    "hook handle",
    "exterior light",
    "master caution",
    "canopy",
    "engine",
    "apu",
    "jettison",
    "light",
]
