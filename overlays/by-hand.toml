name = "By hand"
says = "the wishes as they were written, one function at a time"

# Not rules: these are the 86 hand-written wishes that used to sit in the
# needs files, one `[[want]]` each, carried over so that splitting the files
# moved nothing on the desk. It is the baseline a real overlay is diffed
# against -- write `overlays/<yours>.toml` keyed on `suits` and `urgency`, lay
# the same game out with both, and the difference is what the rule says.
#
# Every want names its `game`, because a want naming `what` is not general:
# MSFS and Falcon BMS both have a function called `Gear`, and without the
# scope MSFS's landing gear took Falcon's pin to a keyboard button.

